services:
  db:
    image: postgres:15-alpine
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusconnect
      POSTGRES_PASSWORD: campusconnect_local_pw
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in docker-entrypoint-initdb.d runs ONCE, only when the
      # data volume is empty (i.e. first container start).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusconnect -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: unless-stopped
    env_file:
      # Real secrets (JWT_SECRET_KEY etc.) come from here and are never
      # committed. See backend/.env.example for the required keys.
      - ./backend/.env
    environment:
      # Overrides backend/.env's DATABASE_URL so the container talks to
      # the local `db` service instead of Neon when run via compose.
      DATABASE_URL: postgresql://campusconnect:campusconnect_local_pw@db:5432/campusconnect
      ENVIRONMENT: development
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata: