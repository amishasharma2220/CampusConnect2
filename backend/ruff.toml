# Ruff config for the CampusConnect backend (Phase 5: full rule set).
#
# Run locally:  ruff check .          (lint)
#               ruff check --fix .    (auto-fix what's safe)
# CI and the pre-commit hook run the same checks.

target-version = "py311"

# 140 rather than ruff's default 88: the SQLAlchemy models use aligned
# one-line Column(...) declarations that read better unwrapped.
line-length = 140

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # import sorting
    "UP",   # pyupgrade: modern Python 3.11 syntax
    "B",    # flake8-bugbear: likely bugs
    "DTZ",  # naive datetimes (datetime.utcnow() etc.)
    "SIM",  # simplifications
    "C4",   # comprehension improvements
    "RUF",  # ruff-specific checks
]

ignore = [
    # UP042 wants `class X(str, Enum)` -> `StrEnum`. That changes what
    # str()/f-strings return for enum members, so it's a behaviour change,
    # not a style fix. Revisit deliberately if ever wanted.
    "UP042",
]

[lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as default arguments.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[lint.isort]
known-first-party = ["app"]
# backend/alembic/ (our migrations folder) would otherwise make ruff
# treat the installed `alembic` package as first-party.
known-third-party = ["alembic"]
