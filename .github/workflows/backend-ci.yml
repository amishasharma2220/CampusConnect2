name: Backend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-test:
    name: Lint & Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: campusconnect
          POSTGRES_PASSWORD: campusconnect_local_pw
          POSTGRES_DB: campusconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusconnect -d campusconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://campusconnect:campusconnect_local_pw@localhost:5432/campusconnect
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (version from backend/.python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.9

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations to a fresh database
        run: alembic upgrade head

      - name: Check models and migrations are in sync
        run: alembic check

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
