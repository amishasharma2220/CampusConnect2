name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Reusable-workflow calls: these actually re-run the full backend/frontend
  # CI jobs (not just check a status), so a push to main can never deploy
  # without passing CI first — no race condition with the standalone
  # backend-ci.yml / frontend-ci.yml runs triggered by the same push.
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  deploy-backend:
    name: Trigger Render deploy
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Frontend deploy note
        run: echo "Vercel is connected directly to this GitHub repo (Vercel Git integration) and auto-deploys pushes to main on its own — no action needed here."