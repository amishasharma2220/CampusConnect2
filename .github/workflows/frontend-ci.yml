name: Frontend CI

on:
  push:
  pull_request:
    branches: [main]
  # Lets deploy.yml invoke this as a reusable workflow (uses: ./.github/workflows/frontend-ci.yml)
  workflow_call:

jobs:
  build:
    name: Build & Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run ESLint (if configured)
        run: |
          if npm run | grep -qE '(^| )lint( |$)'; then
            npm run lint
          else
            echo "::notice::No 'lint' script found yet (.eslintrc.json — Phase 5) — skipping ESLint for now."
          fi