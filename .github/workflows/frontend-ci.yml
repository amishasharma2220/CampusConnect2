name: Frontend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    name: Lint, Typecheck & Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint, zero warnings allowed)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build
        run: npm run build
